apiVersion: apps/v1
kind: Deployment
metadata:
  name: fronted 
  namespace: banking

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: workernode1
      containers:
        - name: frontend
          image: hrrsh471/java-fintech-frontend1
          imagePullPolicy: Always
          ports:
            - containerPort: 80