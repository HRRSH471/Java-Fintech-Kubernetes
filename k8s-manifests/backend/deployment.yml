apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: banking

spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: workernode1
      containers:
        - name: backend
          image: hariomharish/java-fintech-backend:1.1
          imagePullPolicy: Always
          ports:
           - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-service.banking.svc.cluster.local:5432/bankingdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              value: "1df0f6fe85156663c1c36121a92b3fc1702bcf52779752d63c25d75915bcd831"
            - name: JWT_EXPIRATION_MS
              value: "8640000"
            - name: CORS_ALLOWED_ORIGIN
              value: "http://bank.itisdevops.in"
          resources:
            requests: 
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"    
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
  
